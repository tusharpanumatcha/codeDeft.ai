<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">How an AI assistant uses codeDeft</title><desc id="d">The assistant asks for task context, writes code using only what exists, calls verify_code, fixes any reported errors using the suggested real names, and finishes when every import, export and package checks out.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d50"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c6863"/></marker></defs><rect width="1000" height="430" rx="16" fill="#faf9f7" stroke="#d9d5cc"/><text x="32" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1f2a26" text-anchor="start">Context first, then a check</text><text x="32" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#5c6863" text-anchor="start">The assistant works from what really exists in your repository, and verifies before it finishes.</text><rect x="32" y="110" width="152" height="140" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="48" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Your task</text><text x="48" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">"Add a checkout page</text><text x="48" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">that uses PayButton"</text><circle cx="162" cy="110" r="13" fill="#2f5d50"/><text x="162" y="115" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><path d="M186 180 L224 180" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><rect x="228" y="110" width="152" height="140" rx="12" fill="#e3efe9" stroke="#2f5d50" stroke-width="1.5"/><text x="244" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">get_task_context</text><text x="244" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Real files and excerpts,</text><text x="244" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">exports, aliases,</text><text x="244" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">packages, reuse</text><circle cx="358" cy="110" r="13" fill="#2f5d50"/><text x="358" y="115" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><path d="M382 180 L420 180" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><rect x="424" y="110" width="152" height="140" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="440" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Assistant writes</text><text x="440" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Imports only what</text><text x="440" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">the context showed</text><text x="440" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">exists</text><circle cx="554" cy="110" r="13" fill="#2f5d50"/><text x="554" y="115" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><path d="M578 180 L616 180" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="110" width="152" height="140" rx="12" fill="#e3efe9" stroke="#2f5d50" stroke-width="1.5"/><text x="636" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">verify_code</text><text x="636" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Every file, export</text><text x="636" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">and package is</text><text x="636" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">checked</text><circle cx="750" cy="110" r="13" fill="#2f5d50"/><text x="750" y="115" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><path d="M774 180 L812 180" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><rect x="816" y="110" width="152" height="140" rx="12" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="832" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2e7d4f" text-anchor="start">Done</text><text x="832" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">No invented imports,</text><text x="832" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">no missing packages,</text><text x="832" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">no copied helpers</text><circle cx="946" cy="110" r="13" fill="#2f5d50"/><text x="946" y="115" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><path d="M700 254 Q600 330 500 254" fill="none" stroke="#5c6863" stroke-width="2" marker-end="url(#arrowm)"/><text x="600" y="306" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="middle">fix and check again</text><rect x="395" y="318" width="410" height="78" rx="10" fill="#f8e3e0" stroke="#a3322a" stroke-width="1.5"/><text x="411" y="342" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#a3322a" text-anchor="start">verify_code found a problem</text><text x="411" y="362" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2a26" text-anchor="start">Checkout.vue:3  "formatCurrency" is not exported</text><text x="411" y="381" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2a26" text-anchor="start">by src/utils/money.ts. Did you mean formatPrice?</text><text x="32" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">If something is wrong, the</text><text x="32" y="349" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">assistant gets the line and the</text><text x="32" y="368" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">closest real name, fixes it and</text><text x="32" y="387" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">checks again.</text></svg>
