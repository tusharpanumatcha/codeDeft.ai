<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">codeDeft engine pipeline</title><desc id="d">Repository files are indexed into files, symbols, exports, imports and resolved aliases, built into a dependency graph and conventions, persisted in SQLite, and used for search with citations, agent context plans and verification of proposed code.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d50"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c6863"/></marker></defs><rect width="1000" height="420" rx="16" fill="#faf9f7" stroke="#d9d5cc"/><text x="32" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1f2a26" text-anchor="start">Engine: index once, answer from facts</text><text x="32" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#5c6863" text-anchor="start">A standalone Node.js + TypeScript library and CLI. No network calls except opt-in model generation.</text><rect x="32" y="110" width="180" height="150" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="48" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Repository</text><text x="48" y="162" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5c6863" text-anchor="start">src/**/*.ts, *.vue…</text><text x="48" y="181" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5c6863" text-anchor="start">package.json</text><text x="48" 