<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">codeDeft architecture</title><desc id="d">AI assistants, the web dashboard and the VS Code extension talk to the codeDeft MCP server and the local API server, which use the engine and a SQLite database. The repository is only read; new files are created only after approval in VS Code.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d50"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c6863"/></marker></defs><rect width="1000" height="600" rx="16" fill="#faf9f7" stroke="#d9d5cc"/><text x="32" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1f2a26" text-anchor="start">How codeDeft fits together</text><text x="32" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#5c6863" text-anchor="start">Everything runs on your machine. Your code never leaves it unless you configure a model endpoint.</text><text x="32" y="112" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#5c6863" text-anchor="start">WHERE YOU WORK</text><rect x="32" y="124" width="300" height="118" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="48" y="152" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">AI assistants</text><rect x="283" y="136" width="37" height="22" rx="11" fill="#e3efe9" stroke="#e3efe9" stroke-width="1.5"/><text x="301.5" y="151" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2f5d50" text-anchor="middle">MCP</text><text x="48" y="176" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">GitHub Copilot (agent mode), Claude,</text><text x="48" y="195" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Cursor… ask codeDeft for context</text><text x="48" y="214" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">and check their code with it</text><rect x="350" y="124" width="300" height="118" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="366" y="152" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Web dashboard</text><rect x="559" y="136" width="79" height="22" rx="11" fill="#e3efe9" stroke="#e3efe9" stroke-width="1.5"/><text x="598.5" y="151" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2f5d50" text-anchor="middle">127.0.0.1</text><text x="366" y="176" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Feature chats: Figma frame, reuse</text><text x="366" y="195" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">decisions, dependencies and</text><text x="366" y="214" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">proposals per feature</text><rect x="668" y="124" width="300" height="118" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="684" y="152" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">VS Code extension</text><text x="684" y="176" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Registers codeDeft with Copilot;</text><text x="684" y="195" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">previews proposals and creates</text><text x="684" y="214" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">files only after you approve</text><text x="32" y="290" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#5c6863" text-anchor="start">CODEDEFT</text><rect x="32" y="302" width="300" height="112" rx="12" fill="#e3efe9" stroke="#2f5d50" stroke-width="1.5"/><text x="48" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">MCP server</text><text x="48" y="354" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">get_task_context · verify_code</text><text x="48" y="373" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">search · lookup_symbol</text><text x="48" y="392" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">find_reusable_code · dependencies</text><rect x="350" y="302" width="618" height="112" rx="12" fill="#e3efe9" stroke="#2f5d50" stroke-width="1.5"/><text x="366" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Local API server</text><text x="366" y="354" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Feature chats · reuse intelligence · Figma reading · grounded generation</text><text x="366" y="373" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">(generate → verify → repair) · proposals. Listens on 127.0.0.1 only,</text><text x="366" y="392" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">checks Host/Origin and an optional token.</text><path d="M182 242 L182 300" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 242 L500 300" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><path d="M818 242 L818 300" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="462" width="452" height="108" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="48" y="490" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Engine</text><text x="48" y="514" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Index files · symbols · exports · import aliases</text><text x="48" y="533" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Dependency graph · conventions · search</text><text x="48" y="552" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Verify imports, exports and packages</text><rect x="500" y="462" width="220" height="108" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="516" y="490" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">SQLite</text><text x="516" y="514" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Repository index</text><text x="516" y="533" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Feature chats</text><text x="516" y="552" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Designs · proposals</text><rect x="736" y="462" width="232" height="108" rx="12" fill="#f1efea" stroke="#b9b3a6" stroke-width="1.5"/><text x="752" y="490" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Outside (optional)</text><text x="752" y="514" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Figma API: frame reads</text><text x="752" y="533" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Model endpoint: generation</text><text x="752" y="552" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">Token used per request</text><path d="M182 414 L182 460" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 414 L560 460" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><path d="M852 414 L852 460" fill="none" stroke="#5c6863" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowm)"/><text x="196" y="445" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">reads your repository, never edits it</text></svg>
