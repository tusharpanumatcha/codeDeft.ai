<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">Figma frame to code proposal</title><desc id="d">A Figma frame is read once with your token, summarised into layers, components and texts, matched to existing files, combined with your reuse choices into a verified proposal of new files that you review and approve in VS Code.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d50"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c6863"/></marker></defs><rect width="1000" height="440" rx="16" fill="#faf9f7" stroke="#d9d5cc"/><text x="32" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1f2a26" text-anchor="start">From a Figma frame to reviewed code</text><text x="32" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#5c6863" text-anchor="start">Paste a frame link in a feature chat. Nothing is written until you approve it in VS Code.</text><rect x="32" y="110" width="170" height="200" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="48" y="136" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1f2a26" text-anchor="start">Checkout</text><rect x="48" y="150" width="138" height="18" rx="4" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><rect x="48" y="176" width="100" height="12" rx="4" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><rect x="48" y="196" width="120" height="12" rx="4" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><rect x="48" y="222" width="138" height="40" rx="6" fill="#f1efea" stroke="#b9b3a6" stroke-width="1.5" stroke-dasharray="6 5"/><text x="117" y="247" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5c6863" text-anchor="middle">OrderSummary</text><rect x="48" y="272" width="138" height="26" rx="8" fill="#2f5d50" stroke="#2f5d50" stroke-width="1.5"/><text x="117" y="290" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Pay now</text><text x="117" y="332" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1f2a26" text-anchor="middle">Figma frame</text><text x="117" y="350" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5c6863" text-anchor="middle">figma.com/design/…?node-id=</text><rect x="240" y="140" width="148" height="150" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="256" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Read once</text><text x="256" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Token used for this</text><text x="256" y="211" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">request only; never</text><text x="256" y="230" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">stored or logged</text><circle cx="366" cy="140" r="13" fill="#2f5d50"/><text x="366" y="145" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="436" y="140" width="148" height="150" rx="12" fill="#e3efe9" stroke="#2f5d50" stroke-width="1.5"/><text x="452" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Design summary</text><text x="452" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">48 layers</text><text x="452" y="211" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">6 components</text><text x="452" y="230" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Texts: "Pay now", …</text><circle cx="562" cy="140" r="13" fill="#2f5d50"/><text x="562" y="145" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="632" y="140" width="148" height="150" rx="12" fill="#e3efe9" stroke="#2f5d50" stroke-width="1.5"/><text x="648" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Match + choices</text><text x="648" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">PayButton.vue</text><text x="648" y="211" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">  → Reuse</text><text x="648" y="230" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">CartView.vue</text><text x="648" y="249" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">  → Reference only</text><circle cx="758" cy="140" r="13" fill="#2f5d50"/><text x="758" y="145" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="828" y="140" width="148" height="150" rx="12" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="844" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2e7d4f" text-anchor="start">Proposal</text><text x="844" y="192" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">New files only</text><text x="844" y="211" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Imports checked</text><text x="844" y="230" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Open in VS Code</text><circle cx="954" cy="140" r="13" fill="#2f5d50"/><text x="954" y="145" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><path d="M204 210 L238 210" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><path d="M390 210 L434 210" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><path d="M586 210 L630 210" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><path d="M782 210 L826 210" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="322" width="736" height="84" rx="10" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="258" y="348" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1f2a26" text-anchor="start">Stored with the feature</text><text x="258" y="370" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">The design summary, closest files and your reuse choices stay in the feature chat (SQLite), so the next</text><text x="258" y="389" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">generation uses them again. Large files: use “Copy link to selection” so the link points at one frame.</text></svg>
