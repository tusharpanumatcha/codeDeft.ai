<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="t d"><title id="t">Independent proposals: new files only, after approval</title><desc id="d">A generated proposal passes a safety gate that rejects existing files, paths outside the repository, node_modules and hidden or config folders. VS Code previews each file and creates them only after Approve and Create; cancelling changes nothing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d50"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c6863"/></marker></defs><rect width="1000" height="460" rx="16" fill="#faf9f7" stroke="#d9d5cc"/><text x="32" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1f2a26" text-anchor="start">New files only, and only after you approve</text><text x="32" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#5c6863" text-anchor="start">The server returns proposals. Only the VS Code extension can create files, and only when you say so.</text><rect x="32" y="110" width="200" height="128" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="48" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Proposal</text><text x="48" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">2 new files</text><text x="48" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Checkout.vue</text><text x="48" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">OrderSummary.vue</text><rect x="276" y="110" width="250" height="128" rx="12" fill="#e3efe9" stroke="#2f5d50" stroke-width="1.5"/><text x="292" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Safety gate</text><text x="292" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Server and extension reject:</text><text x="292" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">existing files, paths</text><text x="292" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">outside the repository,</text><text x="292" y="219" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">node_modules, .git, .env*…</text><rect x="570" y="110" width="180" height="128" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="586" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Preview in VS Code</text><text x="586" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Each file opens as</text><text x="586" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">an unsaved preview;</text><text x="586" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">paths in Output panel</text><rect x="794" y="110" width="174" height="128" rx="12" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/><text x="810" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#2e7d4f" text-anchor="start">Approve and Create</text><text x="810" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Rechecks nothing exists;</text><text x="810" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">creates complete files,</text><text x="810" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">overwrite off, Undo works</text><path d="M234 174 L274 174" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><path d="M528 174 L568 174" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><path d="M752 174 L792 174" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><text x="881" y="262" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="middle">Cancel → nothing changes</text><rect x="32" y="290" width="440" height="140" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="50" y="316" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1f2a26" text-anchor="start">Your repository after approval</text><text x="50" y="342" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">src/components/PayButton.vue</text><text x="456" y="342" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="end">unchanged</text><text x="50" y="364" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2a26" text-anchor="start">src/components/OrderSummary.vue</text><text x="456" y="364" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2e7d4f" text-anchor="end">+ new</text><text x="50" y="386" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">src/views/CartView.vue</text><text x="456" y="386" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="end">unchanged</text><text x="50" y="408" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2a26" text-anchor="start">src/views/Checkout.vue</text><text x="456" y="408" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2e7d4f" text-anchor="end">+ new</text><rect x="496" y="290" width="472" height="140" rx="12" fill="#fbf1dc" stroke="#8a5a00" stroke-width="1.5"/><text x="514" y="316" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="start">You still wire it in</text><text x="514" y="340" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1f2a26" text-anchor="start">Adding the new page to a router or parent component is</text><text x="514" y="360" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1f2a26" text-anchor="start">deliberately not automatic: no existing file is edited.</text><text x="514" y="380" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1f2a26" text-anchor="start">Review the imports in the preview; in feature chats,</text><text x="514" y="400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1f2a26" text-anchor="start">reused modules are imported, never copied.</text></svg>
