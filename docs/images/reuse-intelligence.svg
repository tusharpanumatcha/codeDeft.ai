<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">Reuse intelligence</title><desc id="d">A requirement is matched against code units from the repository using name, path, structure and usage evidence. Ranked candidates show their source and evidence, and you choose Reuse, Extract, Extend or Keep independent. The result is a review plan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d50"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c6863"/></marker></defs><rect width="1000" height="450" rx="16" fill="#faf9f7" stroke="#d9d5cc"/><text x="32" y="44" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1f2a26" text-anchor="start">Find what already exists before writing it again</text><text x="32" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#5c6863" text-anchor="start">Evidence first: every suggestion shows the real source, where it is used and why it matched.</text><rect x="32" y="110" width="196" height="150" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="48" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Requirement</text><text x="48" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">"validate access</text><text x="48" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5c6863" text-anchor="start">token"</text><rect x="262" y="110" width="196" height="150" rx="12" fill="#ffffff" stroke="#d9d5cc" stroke-width="1.5"/><text x="278" y="138" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Scan</text><text x="278" y="162" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Code units in Vue, TS,</text><text x="278" y="181" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">JS, Java, Python, Go,</text><text x="278" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">C#, Kotlin, Rust</text><text x="278" y="219" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#5c6863" text-anchor="start">Cached until files change</text><path d="M230 185 L260 185" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><path d="M460 185 L490 185" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><rect x="492" y="110" width="476" height="150" rx="12" fill="#ffffff" stroke="#2f5d50" stroke-width="1.5"/><text x="510" y="136" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2a26" text-anchor="start">Ranked candidates</text><rect x="508" y="152" width="444" height="28" rx="6" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><text x="518" y="171" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2a26" text-anchor="start">verifyToken()  src/auth/jwt.ts</text><rect x="812" y="162" width="70" height="8" rx="4" fill="#d9d5cc" stroke="#d9d5cc" stroke-width="1.5"/><rect x="812" y="162" width="64.4" height="8" rx="4" fill="#2f5d50" stroke="#2f5d50" stroke-width="1.5"/><text x="942" y="171" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5c6863" text-anchor="end">used by 7</text><rect x="508" y="186" width="444" height="28" rx="6" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><text x="518" y="205" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2a26" text-anchor="start">useSession()  src/auth/session.ts</text><rect x="812" y="196" width="70" height="8" rx="4" fill="#d9d5cc" stroke="#d9d5cc" stroke-width="1.5"/><rect x="812" y="196" width="44.800000000000004" height="8" rx="4" fill="#2f5d50" stroke="#2f5d50" stroke-width="1.5"/><text x="942" y="205" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5c6863" text-anchor="end">used by 4</text><rect x="508" y="220" width="444" height="28" rx="6" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><text x="518" y="239" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1f2a26" text-anchor="start">decodeBase64()  src/utils/b64.ts</text><rect x="812" y="230" width="70" height="8" rx="4" fill="#d9d5cc" stroke="#d9d5cc" stroke-width="1.5"/><rect x="812" y="230" width="26.6" height="8" rx="4" fill="#2f5d50" stroke="#2f5d50" stroke-width="1.5"/><text x="942" y="239" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5c6863" text-anchor="end">used by 2</text><text x="32" y="300" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#5c6863" text-anchor="start">EVIDENCE SHOWN FOR EACH</text><rect x="32" y="312" width="144.4" height="26" rx="13" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><text x="104.2" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1f2a26" text-anchor="middle">Name / path match</text><rect x="184.4" y="312" width="202.0" height="26" rx="13" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><text x="285.4" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1f2a26" text-anchor="middle">Excerpt with line numbers</text><rect x="394.4" y="312" width="72.4" height="26" rx="13" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><text x="430.59999999999997" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1f2a26" text-anchor="middle">Imports</text><rect x="474.79999999999995" y="312" width="137.2" height="26" rx="13" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><text x="543.4" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1f2a26" text-anchor="middle">Where it is used</text><rect x="620.0" y="312" width="137.2" height="26" rx="13" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><text x="688.6" y="330" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1f2a26" text-anchor="middle">Estimated effort</text><text x="32" y="372" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#5c6863" text-anchor="start">YOUR DECISION</text><rect x="32" y="384" width="58.0" height="26" rx="13" fill="#e3efe9" stroke="#e3efe9" stroke-width="1.5"/><text x="61.0" y="402" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2f5d50" text-anchor="middle">Reuse</text><rect x="98.0" y="384" width="72.4" height="26" rx="13" fill="#e3efe9" stroke="#e3efe9" stroke-width="1.5"/><text x="134.2" y="402" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2f5d50" text-anchor="middle">Extract</text><rect x="178.4" y="384" width="65.2" height="26" rx="13" fill="#e3efe9" stroke="#e3efe9" stroke-width="1.5"/><text x="211.0" y="402" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2f5d50" text-anchor="middle">Extend</text><rect x="251.60000000000002" y="384" width="137.2" height="26" rx="13" fill="#f1efea" stroke="#f1efea" stroke-width="1.5"/><text x="320.20000000000005" y="402" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1f2a26" text-anchor="middle">Keep independent</text><path d="M402.8 397 L446.8 397" fill="none" stroke="#2f5d50" stroke-width="2" marker-end="url(#arrow)"/><text x="456.8" y="402" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2e7d4f" text-anchor="start">A review plan. No files are modified.</text></svg>
